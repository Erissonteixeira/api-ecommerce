spring:
  application:
    name: api-ecommerce

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:uma-chave-bem-grande-com-pelo-menos-32-caracteres!!!}
    expiration-minutes: ${JWT_EXP_MINUTES:120}

security:
  jwt:
    secret: ${app.jwt.secret}
    expiration-minutes: ${app.jwt.expiration-minutes}
    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          show-details: never